<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Ant Formicarium</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #ddd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      canvas {
        image-rendering: pixelated;
        width: 800px;
        height: 600px;
        border: 1px solid #666;
        background: #fff;
      }

      .meta {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Realtime Ant Formicarium (400×300)</h1>
      <canvas id="world" width="400" height="300"></canvas>
      <div class="meta" id="meta">Starting simulation…</div>
    </div>

    <script>
      const WIDTH = 400;
      const HEIGHT = 300;
      const ANT_COUNT = 1;
      const STEP_INTERVAL_MS = 360;
      const SURFACE_BAND = 20;
      const ROOM_SPACING_SOFT_MIN = 15;

      const COLORS = {
        soil: [96, 96, 96, 255],
        empty: [255, 255, 255, 255],
        ant: [0, 0, 0, 255],
      };

      const canvas = document.getElementById("world");
      const meta = document.getElementById("meta");
      const ctx = canvas.getContext("2d", { alpha: false });
      const image = ctx.createImageData(WIDTH, HEIGHT);
      const cells = new Uint8Array(WIDTH * HEIGHT); // 0 soil, 1 empty
      const ants = [];
      const rooms = [];

      const idx = (x, y) => y * WIDTH + x;
      const inBounds = (x, y) => x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT;

      function setPixel(i, rgba) {
        image.data[i] = rgba[0];
        image.data[i + 1] = rgba[1];
        image.data[i + 2] = rgba[2];
        image.data[i + 3] = rgba[3];
      }

      function isSoil(x, y) {
        return inBounds(x, y) && cells[idx(x, y)] === 0;
      }

      function hasNearbySoil(x, y, radius = 2) {
        for (let dy = -radius; dy <= radius; dy++) {
          for (let dx = -radius; dx <= radius; dx++) {
            if ((dx !== 0 || dy !== 0) && isSoil(x + dx, y + dy)) return true;
          }
        }
        return false;
      }

      function drawTerrain() {
        for (let y = 0; y < HEIGHT; y++) {
          for (let x = 0; x < WIDTH; x++) {
            const c = cells[idx(x, y)];
            const p = idx(x, y) * 4;
            setPixel(p, c === 1 ? COLORS.empty : COLORS.soil);
          }
        }
      }

      function drawAnts() {
        for (const ant of ants) {
          const p = idx(ant.x, ant.y) * 4;
          setPixel(p, COLORS.ant);
        }
      }

      function buildSurfaceBand() {
        for (let x = 0; x < WIDTH; x++) {
          const roughness = Math.floor((Math.random() - 0.5) * 8);
          const depth = Math.max(14, Math.min(26, SURFACE_BAND + roughness));
          for (let y = 0; y < depth; y++) cells[idx(x, y)] = 1;
        }
      }

      function dig(x, y) {
        if (!inBounds(x, y)) return;
        cells[idx(x, y)] = 1;
      }

      // Keep tunnels around 2-3 pixels thick.
      function digTunnelBrush(x, y) {
        dig(x, y);
        dig(x + 1, y);
        dig(x - 1, y);
        dig(x, y + 1);
        dig(x, y - 1);

        if (Math.random() < 0.4) dig(x + (Math.random() < 0.5 ? 1 : -1), y + (Math.random() < 0.5 ? 1 : -1));
      }

      function digRoom(cx, cy, w, h) {
        const left = Math.floor(cx - w / 2);
        const right = left + w - 1;
        const top = Math.floor(cy - h / 2);
        const bottom = top + h - 1;

        for (let y = top; y <= bottom; y++) {
          for (let x = left; x <= right; x++) {
            if (!inBounds(x, y)) continue;
            cells[idx(x, y)] = 1;
          }
        }

        rooms.push({ cx, cy, w, h });
      }

      function maybeDigRoom(ant) {
        if (ant.y < SURFACE_BAND + 12) return;
        if (Math.random() > 0.08) return;

        const roomW = 10 + Math.floor(Math.random() * 6); // 10..15
        const roomH = 5 + Math.floor(Math.random() * 6); // 5..10
        const cx = ant.x + Math.floor((Math.random() - 0.5) * 10);
        const cy = ant.y + Math.floor((Math.random() - 0.5) * 6);

        if (!inBounds(cx, cy)) return;

        let minDist = Infinity;
        for (const room of rooms) {
          const d = Math.hypot(cx - room.cx, cy - room.cy);
          if (d < minDist) minDist = d;
        }

        // Soft spacing: strongly prefer at least 15px apart.
        if (minDist < ROOM_SPACING_SOFT_MIN && Math.random() < 0.85) return;

        digRoom(cx, cy, roomW, roomH);
      }

      function chooseStep(ant) {
        const dirs = [
          [0, 1],
          [1, 0],
          [-1, 0],
          [0, -1],
        ];

        // Prefer moving underground.
        const weighted = [];
        for (const [dx, dy] of dirs) {
          let weight = 1;
          if (dy > 0) weight += 2;
          if (ant.y < SURFACE_BAND + 30 && dy > 0) weight += 2;
          for (let i = 0; i < weight; i++) weighted.push([dx, dy]);
        }

        return weighted[Math.floor(Math.random() * weighted.length)];
      }

      function updateAnt(ant) {
        if (Math.random() < 0.35) {
          const [vx, vy] = chooseStep(ant);
          ant.vx = vx;
          ant.vy = vy;
        }

        let nx = ant.x + ant.vx;
        let ny = ant.y + ant.vy;

        if (!inBounds(nx, ny) || !hasNearbySoil(nx, ny, 2)) {
          let found = false;
          for (let i = 0; i < 8; i++) {
            const [vx, vy] = chooseStep(ant);
            const tx = ant.x + vx;
            const ty = ant.y + vy;
            if (inBounds(tx, ty) && hasNearbySoil(tx, ty, 2)) {
              ant.vx = vx;
              ant.vy = vy;
              nx = tx;
              ny = ty;
              found = true;
              break;
            }
          }
          if (!found) return;
        }

        ant.x = nx;
        ant.y = ny;

        digTunnelBrush(ant.x, ant.y);
        maybeDigRoom(ant);
      }

      function seedAnts() {
        const sx = Math.floor(WIDTH / 2);
        const sy = SURFACE_BAND + 3;
        for (let i = 0; i < ANT_COUNT; i++) {
          ants.push({
            x: sx,
            y: sy,
            vx: 0,
            vy: 1,
          });
        }
      }

      let frame = 0;
      let lastStepTime = 0;
      function tick() {
        frame++;

        const now = performance.now();
        if (now - lastStepTime >= STEP_INTERVAL_MS) {
          lastStepTime = now;
          for (const ant of ants) updateAnt(ant);
        }

        drawTerrain();
        drawAnts();
        ctx.putImageData(image, 0, 0);

        let empty = 0;
        for (let i = 0; i < cells.length; i++) if (cells[i] === 1) empty++;
        meta.textContent = `frame=${frame} ants=${ants.length} rooms=${rooms.length} empty=${empty}`;

        requestAnimationFrame(tick);
      }

      buildSurfaceBand();
      seedAnts();
      tick();
    </script>
  </body>
</html>
