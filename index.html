<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Ant Formicarium</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #ddd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .panel { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
      .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      button {
        background: #222;
        color: #ddd;
        border: 1px solid #666;
        padding: 0.3rem 0.55rem;
        cursor: pointer;
      }
      button:hover { background: #333; }
      canvas {
        image-rendering: pixelated;
        width: 800px;
        height: 600px;
        border: 1px solid #666;
        background: #fff;
      }
      .rules { max-width: 800px; font-size: 0.8rem; line-height: 1.35; opacity: 0.9; }
      .rules ul { margin: 0.35rem 0 0 1.1rem; padding: 0; }
      .meta { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Realtime Ant Formicarium (400×300)</h1>
      <div class="controls">
        <button id="speed-play" type="button">Play</button>
        <button id="speed-fast" type="button">Fast</button>
        <button id="speed-very-fast" type="button">Very fast</button>
        <button id="speed-very-very-fast" type="button">Very very fast</button>
      </div>
      <canvas id="world" width="400" height="300"></canvas>
      <div class="rules">
        Nest rules:
        <ul>
          <li>The queen moves 1 pixel per step, only into adjacent empty cells (no jumps).</li>
          <li>Surface texture variation is capped to a maximum 3px height difference.</li>
          <li>The queen excavates the chamber one pixel at a time.</li>
        </ul>
      </div>
      <div class="meta" id="meta">Starting simulation…</div>
    </div>

    <script>
      const WIDTH = 400;
      const HEIGHT = 300;
      const DIG_INTERVAL_MS = 360; // Global dig speed.
      const SURFACE_BAND = 20;
      const SPEEDS = { play: 1, fast: 10, veryFast: 100, veryVeryFast: 1000 };

      const COLORS = {
        soil: [96, 96, 96, 255],
        surfaceEmpty: [255, 255, 255, 255],
        excavatedEmpty: [255, 255, 255, 255],
        ant: [0, 0, 0, 255],
      };

      const canvas = document.getElementById("world");
      const meta = document.getElementById("meta");
      const speedPlayButton = document.getElementById("speed-play");
      const speedFastButton = document.getElementById("speed-fast");
      const speedVeryFastButton = document.getElementById("speed-very-fast");
      const speedVeryVeryFastButton = document.getElementById("speed-very-very-fast");
      const ctx = canvas.getContext("2d", { alpha: false });
      const image = ctx.createImageData(WIDTH, HEIGHT);

      const cells = new Uint8Array(WIDTH * HEIGHT); // 0 soil, 1 surface-empty, 2 excavated-empty
      const surfaceDepthByX = new Uint16Array(WIDTH);
      const ants = [];
      let speedMultiplier = SPEEDS.play;

      const idx = (x, y) => y * WIDTH + x;
      const inBounds = (x, y) => x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT;
      const key = (x, y) => `${x},${y}`;

      function setPixel(i, rgba) {
        image.data[i] = rgba[0];
        image.data[i + 1] = rgba[1];
        image.data[i + 2] = rgba[2];
        image.data[i + 3] = rgba[3];
      }

      function isEmpty(x, y) {
        return inBounds(x, y) && cells[idx(x, y)] !== 0;
      }

      function isSoil(x, y) {
        return inBounds(x, y) && cells[idx(x, y)] === 0;
      }

      function neighbors4(x, y) {
        return [
          [x, y + 1],
          [x + 1, y],
          [x - 1, y],
          [x, y - 1],
        ].filter(([nx, ny]) => inBounds(nx, ny));
      }

      function neighbors8(x, y) {
        const pts = [];
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx;
            const ny = y + dy;
            if (inBounds(nx, ny)) pts.push([nx, ny]);
          }
        }
        return pts;
      }

      function drawTerrain() {
        for (let y = 0; y < HEIGHT; y++) {
          for (let x = 0; x < WIDTH; x++) {
            const p = idx(x, y) * 4;
            const c = cells[idx(x, y)];
            setPixel(p, c === 0 ? COLORS.soil : c === 1 ? COLORS.surfaceEmpty : COLORS.excavatedEmpty);
          }
        }
      }

      function drawAnts() {
        for (const ant of ants) {
          const p = idx(ant.x, ant.y) * 4;
          setPixel(p, COLORS.ant);
        }
      }

      function buildSurfaceBand() {
        for (let x = 0; x < WIDTH; x++) {
          const roughness = Math.floor(Math.random() * 4); // 0..3 (max 3px variation)
          const depth = SURFACE_BAND + roughness;
          surfaceDepthByX[x] = depth;
          for (let y = 0; y < depth; y++) cells[idx(x, y)] = 1;
        }
      }

      function digOnePixel(x, y) {
        if (!isSoil(x, y)) return false;
        cells[idx(x, y)] = 2;
        return true;
      }

      function countEmptyNeighbors(x, y) {
        let n = 0;
        for (const [nx, ny] of neighbors4(x, y)) if (isEmpty(nx, ny)) n++;
        return n;
      }

      function chooseMove(ant) {
        const moves = neighbors8(ant.x, ant.y).filter(([nx, ny]) => isEmpty(nx, ny));
        if (moves.length === 0) return null;

        // Prefer shared tunnels and active dig zones (no directional bias).
        let best = moves[0];
        let bestScore = -Infinity;
        for (const [nx, ny] of moves) {
          let score = countEmptyNeighbors(nx, ny) * 2;
          const dy = ny - ant.y;
          if (dy !== 0) score += 0.25;
          if (Math.abs(nx - WIDTH / 2) < 18) score += 0.4;
          score += Math.random() * 0.8;
          if (score > bestScore) {
            bestScore = score;
            best = [nx, ny];
          }
        }
        return best;
      }


      function buildMainChamberPixels(cx, cy) {
        const pending = new Set();
        const halfWidth = 10; // ~20px wide chamber
        const chamberWidth = halfWidth * 2;
        const chamberHeight = Math.round(chamberWidth * (0.3 + Math.random() * 0.3)); // 0.3..0.6 width
        const baseSag = 1 + Math.floor(Math.random() * 3); // 1..3px downward curve
        const baseY = cy + Math.floor(chamberHeight / 2);

        for (let x = cx - halfWidth - 1; x <= cx + halfWidth + 1; x++) {
          if (x < 0 || x >= WIDTH) continue;
          const nx = Math.max(-1, Math.min(1, (x - cx) / halfWidth));
          const arch = Math.sqrt(Math.max(0, 1 - nx * nx));
          const roofNoise = Math.floor((Math.random() - 0.5) * 3); // slight irregularity
          const columnBottom = baseY + Math.round(baseSag * (1 - Math.abs(nx)));
          let topY = Math.round(baseY - chamberHeight * arch) + roofNoise;
          topY = Math.min(topY, columnBottom - 2);

          for (let y = topY; y <= columnBottom; y++) {
            if (!inBounds(x, y)) continue;
            pending.add(key(x, y));
          }
        }

        return pending;
      }


      function chamberBottomPoint(pending, fallbackX, fallbackY) {
        let maxY = -1;
        for (const k of pending) {
          const [, sy] = k.split(',').map(Number);
          if (sy > maxY) maxY = sy;
        }
        if (maxY < 0) return [fallbackX, fallbackY];

        let bestX = fallbackX;
        let bestDx = Infinity;
        for (const k of pending) {
          const [sx, sy] = k.split(',').map(Number);
          if (sy !== maxY) continue;
          const dx = Math.abs(sx - fallbackX);
          if (dx < bestDx) {
            bestDx = dx;
            bestX = sx;
          }
        }
        return [bestX, maxY];
      }

      function nearestPendingPixel(ant) {
        let best = null;
        let bestD = Infinity;
        for (const k of ant.chamberPending) {
          const [sx, sy] = k.split(',').map(Number);
          if (!isSoil(sx, sy)) continue;
          const d = Math.abs(sx - ant.x) + Math.abs(sy - ant.y);
          if (d < bestD) {
            bestD = d;
            best = [sx, sy];
          }
        }
        return best;
      }

      function moveToward(ant, tx, ty) {
        const moves = neighbors8(ant.x, ant.y).filter(([nx, ny]) => isEmpty(nx, ny));
        if (moves.length === 0) return;
        let best = moves[0];
        let bestD = Infinity;
        for (const [nx, ny] of moves) {
          const d = Math.abs(tx - nx) + Math.abs(ty - ny);
          if (d < bestD) {
            bestD = d;
            best = [nx, ny];
          }
        }
        ant.x = best[0];
        ant.y = best[1];
      }

      function chooseBuilderDigTarget(ant) {
        const candidates = [];
        for (const [nx, ny] of neighbors8(ant.x, ant.y)) {
          if (!isSoil(nx, ny)) continue;
          const dx = nx - ant.x;
          const dy = ny - ant.y;
          let score = 0;
          if (dy > 0) score += 2.2;
          if (dy < 0) score -= 1.2;
          if (dx === ant.driftX) score += 0.7;
          if (Math.abs(dx - ant.driftX) === 1) score += 0.2;
          score += Math.random();
          candidates.push([nx, ny, score]);
        }
        if (candidates.length === 0) return null;
        candidates.sort((a, b) => b[2] - a[2]);
        return [candidates[0][0], candidates[0][1]];
      }

      function updateAnt(ant) {
        if (ant.phase === "descending") {
          if (Math.random() < 0.35) {
            ant.driftX = Math.max(-1, Math.min(1, ant.driftX + (Math.random() < 0.5 ? -1 : 1)));
          }

          const target = chooseBuilderDigTarget(ant);
          if (target) {
            const [dx, dy] = target;
            if (digOnePixel(dx, dy)) {
              ant.x = dx;
              ant.y = dy;
            }
          } else {
            const next = chooseMove(ant);
            if (next) {
              ant.x = next[0];
              ant.y = next[1];
            }
          }

          const depth = ant.y - ant.surfaceY;
          if (depth >= ant.targetDepth) {
            ant.chamberPending = buildMainChamberPixels(ant.x, ant.y);
            const [wx, wy] = chamberBottomPoint(ant.chamberPending, ant.x, ant.y);
            ant.waitX = wx;
            ant.waitY = wy;
            ant.phase = "chamber";
          }
          return;
        }

        if (ant.phase === "to_bottom") {
          if (ant.x === ant.waitX && ant.y === ant.waitY) {
            ant.phase = "waiting";
            return;
          }
          moveToward(ant, ant.waitX, ant.waitY);
          if (ant.x === ant.waitX && ant.y === ant.waitY) ant.phase = "waiting";
          return;
        }

        // chamber phase: dig one soil pixel per step.
        const adjacentPending = [];
        for (const [nx, ny] of neighbors8(ant.x, ant.y)) {
          const k = key(nx, ny);
          if (ant.chamberPending.has(k) && isSoil(nx, ny)) adjacentPending.push([nx, ny]);
        }

        if (adjacentPending.length > 0) {
          // Try adjacent pending cells in random order; dig at most one pixel this tick.
          for (let i = adjacentPending.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [adjacentPending[i], adjacentPending[j]] = [adjacentPending[j], adjacentPending[i]];
          }
          for (const [dx, dy] of adjacentPending) {
            if (digOnePixel(dx, dy)) {
              ant.x = dx;
              ant.y = dy;
              ant.chamberPending.delete(key(dx, dy));
              return;
            }
          }
        }

        const nearest = nearestPendingPixel(ant);
        if (nearest) {
          moveToward(ant, nearest[0], nearest[1]);
        } else {
          ant.phase = "to_bottom";
        }
      }


      function setSpeed(mode) {
        speedMultiplier = SPEEDS[mode] ?? SPEEDS.play;
      }

      function addAnt() {
        const sx = Math.floor(WIDTH / 2);
        const sy = Math.max(0, (surfaceDepthByX[sx] || SURFACE_BAND) - 1);
        ants.push({
          x: sx,
          y: sy,
          homeX: sx,
          surfaceY: sy,
          driftX: 0,
          phase: "descending",
          targetDepth: 72 + Math.floor(Math.random() * 17), // ~80px depth (72..88)
          chamberPending: new Set(),
          waitX: sx,
          waitY: sy,
        });
      }

      speedPlayButton.addEventListener("click", () => setSpeed("play"));
      speedFastButton.addEventListener("click", () => setSpeed("fast"));
      speedVeryFastButton.addEventListener("click", () => setSpeed("veryFast"));
      speedVeryVeryFastButton.addEventListener("click", () => setSpeed("veryVeryFast"));

      let frame = 0;
      let lastDigTime = 0;
      function tick() {
        frame++;

        const now = performance.now();
        const effectiveDigInterval = Math.max(1, DIG_INTERVAL_MS / speedMultiplier);
        if (now - lastDigTime >= effectiveDigInterval) {
          lastDigTime = now;
          for (const ant of ants) updateAnt(ant);
        }

        drawTerrain();
        drawAnts();
        ctx.putImageData(image, 0, 0);

        let empty = 0;
        for (let i = 0; i < cells.length; i++) if (cells[i] !== 0) empty++;
        const chamberPending = ants[0] ? ants[0].chamberPending.size : 0;
        const phase = ants[0] ? ants[0].phase : "none";
        meta.textContent = `frame=${frame} ants=${ants.length} phase=${phase} chamberPending=${chamberPending} empty=${empty} speed=${speedMultiplier}x`;

        requestAnimationFrame(tick);
      }

      buildSurfaceBand();
      addAnt();
      tick();
    </script>
  </body>
</html>
