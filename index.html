<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Ant Formicarium</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #ddd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      .controls {
        display: flex;
        gap: 0.5rem;
      }

      button {
        background: #222;
        color: #ddd;
        border: 1px solid #666;
        padding: 0.3rem 0.55rem;
        cursor: pointer;
      }

      button:hover {
        background: #333;
      }

      canvas {
        image-rendering: pixelated;
        width: 800px;
        height: 600px;
        border: 1px solid #666;
        background: #fff;
      }

      .meta {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Realtime Ant Formicarium (400×300)</h1>
      <div class="controls">
        <button id="add-ant" type="button">+ Add ant</button>
        <button id="remove-ant" type="button">− Remove ant</button>
      </div>
      <canvas id="world" width="400" height="300"></canvas>
      <div class="meta" id="meta">Starting simulation…</div>
    </div>

    <script>
      const WIDTH = 400;
      const HEIGHT = 300;
      const INITIAL_ANT_COUNT = 1;
      const DIG_INTERVAL_MS = 360; // Global digging speed variable.
      const SURFACE_BAND = 20;
      const ROOM_SPACING_SOFT_MIN = 15;

      const COLORS = {
        soil: [96, 96, 96, 255],
        empty: [255, 255, 255, 255],
        ant: [0, 0, 0, 255],
      };

      const canvas = document.getElementById("world");
      const meta = document.getElementById("meta");
      const addAntButton = document.getElementById("add-ant");
      const removeAntButton = document.getElementById("remove-ant");

      const ctx = canvas.getContext("2d", { alpha: false });
      const image = ctx.createImageData(WIDTH, HEIGHT);
      const cells = new Uint8Array(WIDTH * HEIGHT); // 0 soil, 1 empty
      const ants = [];
      const rooms = [];

      const idx = (x, y) => y * WIDTH + x;
      const inBounds = (x, y) => x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT;

      function setPixel(i, rgba) {
        image.data[i] = rgba[0];
        image.data[i + 1] = rgba[1];
        image.data[i + 2] = rgba[2];
        image.data[i + 3] = rgba[3];
      }

      function isSoil(x, y) {
        return inBounds(x, y) && cells[idx(x, y)] === 0;
      }

      function hasNearbySoil(x, y, radius = 1) {
        for (let dy = -radius; dy <= radius; dy++) {
          for (let dx = -radius; dx <= radius; dx++) {
            if ((dx !== 0 || dy !== 0) && isSoil(x + dx, y + dy)) return true;
          }
        }
        return false;
      }

      function drawTerrain() {
        for (let y = 0; y < HEIGHT; y++) {
          for (let x = 0; x < WIDTH; x++) {
            const c = cells[idx(x, y)];
            const p = idx(x, y) * 4;
            setPixel(p, c === 1 ? COLORS.empty : COLORS.soil);
          }
        }
      }

      function drawAnts() {
        for (const ant of ants) {
          const p = idx(ant.x, ant.y) * 4;
          setPixel(p, COLORS.ant);
        }
      }

      function buildSurfaceBand() {
        for (let x = 0; x < WIDTH; x++) {
          const roughness = Math.floor((Math.random() - 0.5) * 8);
          const depth = Math.max(14, Math.min(26, SURFACE_BAND + roughness));
          for (let y = 0; y < depth; y++) cells[idx(x, y)] = 1;
        }
      }

      function digOnePixel(x, y) {
        if (!inBounds(x, y)) return false;
        const i = idx(x, y);
        if (cells[i] === 1) return false;
        cells[i] = 1;
        return true;
      }

      function generateOrganicRoom(cx, cy, w, h) {
        const points = [];
        const rx = w / 2;
        const ry = h / 2;
        const left = Math.floor(cx - rx - 2);
        const right = Math.ceil(cx + rx + 2);
        const top = Math.floor(cy - ry - 2);
        const bottom = Math.ceil(cy + ry + 2);

        for (let y = top; y <= bottom; y++) {
          for (let x = left; x <= right; x++) {
            if (!inBounds(x, y)) continue;
            const nx = (x - cx) / rx;
            const ny = (y - cy) / ry;
            const dist = nx * nx + ny * ny;
            const jitter = (Math.random() - 0.5) * 0.28;
            if (dist <= 1 + jitter) points.push([x, y]);
          }
        }

        for (let i = points.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [points[i], points[j]] = [points[j], points[i]];
        }

        return points;
      }

      function maybeQueueRoom(ant) {
        if (ant.y < SURFACE_BAND + 12) return;
        if (ant.digQueue.length > 0) return;
        if (Math.random() > 0.07) return;

        const roomW = 10 + Math.floor(Math.random() * 6); // 10..15
        const roomH = 5 + Math.floor(Math.random() * 6); // 5..10
        const cx = ant.x + Math.floor((Math.random() - 0.5) * 10);
        const cy = ant.y + Math.floor((Math.random() - 0.5) * 6);

        if (!inBounds(cx, cy)) return;

        let minDist = Infinity;
        for (const room of rooms) {
          const d = Math.hypot(cx - room.cx, cy - room.cy);
          if (d < minDist) minDist = d;
        }

        if (minDist < ROOM_SPACING_SOFT_MIN && Math.random() < 0.85) return;

        ant.digQueue = generateOrganicRoom(cx, cy, roomW, roomH);
        rooms.push({ cx, cy, w: roomW, h: roomH });
      }

      function chooseStep(ant) {
        const dirs = [
          [0, 1],
          [1, 0],
          [-1, 0],
          [0, -1],
        ];

        const weighted = [];
        for (const [dx, dy] of dirs) {
          let weight = 1;
          if (dy > 0) weight += 2;
          if (ant.y < SURFACE_BAND + 30 && dy > 0) weight += 2;
          for (let i = 0; i < weight; i++) weighted.push([dx, dy]);
        }

        return weighted[Math.floor(Math.random() * weighted.length)];
      }

      function updateAnt(ant) {
        // If shaping a room, remove only one queued pixel this tick.
        if (ant.digQueue.length > 0) {
          const [qx, qy] = ant.digQueue.pop();
          if (digOnePixel(qx, qy)) {
            ant.x = qx;
            ant.y = qy;
          }
          return;
        }

        if (Math.random() < 0.35) {
          const [vx, vy] = chooseStep(ant);
          ant.vx = vx;
          ant.vy = vy;
        }

        let nx = ant.x + ant.vx;
        let ny = ant.y + ant.vy;

        if (!inBounds(nx, ny) || !hasNearbySoil(nx, ny, 1)) {
          let found = false;
          for (let i = 0; i < 8; i++) {
            const [vx, vy] = chooseStep(ant);
            const tx = ant.x + vx;
            const ty = ant.y + vy;
            if (inBounds(tx, ty) && hasNearbySoil(tx, ty, 1)) {
              ant.vx = vx;
              ant.vy = vy;
              nx = tx;
              ny = ty;
              found = true;
              break;
            }
          }
          if (!found) return;
        }

        ant.x = nx;
        ant.y = ny;
        digOnePixel(ant.x, ant.y); // Exactly one pixel removed per step.
        maybeQueueRoom(ant);
      }

      function addAnt() {
        const sx = Math.floor(WIDTH / 2) + Math.floor((Math.random() - 0.5) * 6);
        const sy = SURFACE_BAND + 3 + Math.floor(Math.random() * 2);
        ants.push({
          x: sx,
          y: sy,
          vx: 0,
          vy: 1,
          digQueue: [],
        });
      }

      function removeAnt() {
        if (ants.length > 0) ants.pop();
      }

      addAntButton.addEventListener("click", addAnt);
      removeAntButton.addEventListener("click", removeAnt);

      let frame = 0;
      let lastDigTime = 0;
      function tick() {
        frame++;

        const now = performance.now();
        if (now - lastDigTime >= DIG_INTERVAL_MS) {
          lastDigTime = now;
          for (const ant of ants) updateAnt(ant);
        }

        drawTerrain();
        drawAnts();
        ctx.putImageData(image, 0, 0);

        let empty = 0;
        for (let i = 0; i < cells.length; i++) if (cells[i] === 1) empty++;
        meta.textContent = `frame=${frame} ants=${ants.length} rooms=${rooms.length} empty=${empty} digMs=${DIG_INTERVAL_MS}`;

        requestAnimationFrame(tick);
      }

      buildSurfaceBand();
      for (let i = 0; i < INITIAL_ANT_COUNT; i++) addAnt();
      tick();
    </script>
  </body>
</html>
