<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Ant Formicarium</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #ddd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      canvas {
        image-rendering: pixelated;
        width: 800px;
        height: 600px;
        border: 1px solid #666;
        background: #fff;
      }

      .meta {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Realtime Ant Formicarium (400×300)</h1>
      <canvas id="world" width="400" height="300"></canvas>
      <div class="meta" id="meta">Starting simulation…</div>
    </div>

    <script>
      const WIDTH = 400;
      const HEIGHT = 300;
      const ANT_COUNT = 1;
      const STEP_INTERVAL_MS = 360;
      const SURFACE_BAND = 20;

      const COLORS = {
        soil: [96, 96, 96, 255],
        empty: [255, 255, 255, 255],
        ant: [0, 0, 0, 255],
      };

      const canvas = document.getElementById("world");
      const meta = document.getElementById("meta");
      const ctx = canvas.getContext("2d", { alpha: false });
      const image = ctx.createImageData(WIDTH, HEIGHT);
      const cells = new Uint8Array(WIDTH * HEIGHT); // 0 soil, 1 empty
      const ants = [];

      const idx = (x, y) => y * WIDTH + x;
      const inBounds = (x, y) => x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT;

      function setPixel(i, rgba) {
        image.data[i] = rgba[0];
        image.data[i + 1] = rgba[1];
        image.data[i + 2] = rgba[2];
        image.data[i + 3] = rgba[3];
      }

      function drawTerrain() {
        for (let y = 0; y < HEIGHT; y++) {
          for (let x = 0; x < WIDTH; x++) {
            const c = cells[idx(x, y)];
            const p = idx(x, y) * 4;
            setPixel(p, c === 1 ? COLORS.empty : COLORS.soil);
          }
        }
      }

      function drawAnts() {
        for (const ant of ants) {
          const p = idx(ant.x, ant.y) * 4;
          setPixel(p, COLORS.ant);
        }
      }

      function buildSurfaceBand() {
        for (let x = 0; x < WIDTH; x++) {
          const roughness = Math.floor((Math.random() - 0.5) * 8); // -4..+3
          const depth = Math.max(14, Math.min(26, SURFACE_BAND + roughness));
          for (let y = 0; y < depth; y++) {
            cells[idx(x, y)] = 1;
          }
        }
      }

      function dig(x, y) {
        if (!inBounds(x, y)) return;
        cells[idx(x, y)] = 1;
      }

      function weightedStep(ant) {
        const dirs = [
          [0, 1],
          [1, 0],
          [-1, 0],
          [0, -1],
        ];
        const pick = dirs[Math.floor(Math.random() * dirs.length)];
        ant.vx = pick[0];
        ant.vy = pick[1];
      }

      function updateAnt(ant) {
        if (Math.random() < 0.3) weightedStep(ant);

        let nx = ant.x + ant.vx;
        let ny = ant.y + ant.vy;

        if (!inBounds(nx, ny)) {
          weightedStep(ant);
          nx = ant.x + ant.vx;
          ny = ant.y + ant.vy;
        }

        ant.x = Math.max(0, Math.min(WIDTH - 1, nx));
        ant.y = Math.max(0, Math.min(HEIGHT - 1, ny));

        dig(ant.x, ant.y);
      }

      function seedAnts() {
        const sx = Math.floor(WIDTH / 2);
        const sy = SURFACE_BAND + 2;
        for (let i = 0; i < ANT_COUNT; i++) {
          ants.push({
            x: sx,
            y: sy,
            vx: 0,
            vy: 1,
          });
        }
      }

      let frame = 0;
      let lastStepTime = 0;
      function tick() {
        frame++;

        const now = performance.now();
        const shouldStep = now - lastStepTime >= STEP_INTERVAL_MS;
        if (shouldStep) {
          lastStepTime = now;
          for (let i = 0; i < ants.length; i++) updateAnt(ants[i]);
        }

        drawTerrain();
        drawAnts();
        ctx.putImageData(image, 0, 0);

        const dug = cells.reduce((n, c) => n + (c === 1 ? 1 : 0), 0);
        meta.textContent = `frame=${frame} ants=${ants.length} empty=${dug}`;

        requestAnimationFrame(tick);
      }

      buildSurfaceBand();
      seedAnts();
      tick();
    </script>
  </body>
</html>
