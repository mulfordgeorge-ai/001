<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Ant Formicarium</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #ddd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .panel { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
      .controls { display: flex; gap: 0.5rem; }
      button {
        background: #222;
        color: #ddd;
        border: 1px solid #666;
        padding: 0.3rem 0.55rem;
        cursor: pointer;
      }
      button:hover { background: #333; }
      canvas {
        image-rendering: pixelated;
        width: 800px;
        height: 600px;
        border: 1px solid #666;
        background: #fff;
      }
      .meta { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Realtime Ant Formicarium (400×300)</h1>
      <div class="controls">
        <button id="add-ant" type="button">+ Add ant</button>
        <button id="remove-ant" type="button">− Remove ant</button>
      </div>
      <canvas id="world" width="400" height="300"></canvas>
      <div class="meta" id="meta">Starting simulation…</div>
    </div>

    <script>
      const WIDTH = 400;
      const HEIGHT = 300;
      const INITIAL_ANT_COUNT = 1;
      const DIG_INTERVAL_MS = 360; // Global dig speed.
      const SURFACE_BAND = 20;
      const ROOM_SPACING_SOFT_MIN = 15;
      const DOWNWARD_MOVE_BONUS = 4.5;
      const DOWNWARD_DIG_BONUS = 3.5;

      const COLORS = {
        soil: [96, 96, 96, 255],
        empty: [255, 255, 255, 255],
        ant: [0, 0, 0, 255],
      };

      const canvas = document.getElementById("world");
      const meta = document.getElementById("meta");
      const addAntButton = document.getElementById("add-ant");
      const removeAntButton = document.getElementById("remove-ant");
      const ctx = canvas.getContext("2d", { alpha: false });
      const image = ctx.createImageData(WIDTH, HEIGHT);

      const cells = new Uint8Array(WIDTH * HEIGHT); // 0 soil, 1 empty
      const ants = [];
      const roomPlans = [];

      const idx = (x, y) => y * WIDTH + x;
      const inBounds = (x, y) => x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT;
      const key = (x, y) => `${x},${y}`;

      function setPixel(i, rgba) {
        image.data[i] = rgba[0];
        image.data[i + 1] = rgba[1];
        image.data[i + 2] = rgba[2];
        image.data[i + 3] = rgba[3];
      }

      function isEmpty(x, y) {
        return inBounds(x, y) && cells[idx(x, y)] === 1;
      }

      function isSoil(x, y) {
        return inBounds(x, y) && cells[idx(x, y)] === 0;
      }

      function neighbors4(x, y) {
        return [
          [x, y + 1],
          [x + 1, y],
          [x - 1, y],
          [x, y - 1],
        ].filter(([nx, ny]) => inBounds(nx, ny));
      }

      function drawTerrain() {
        for (let y = 0; y < HEIGHT; y++) {
          for (let x = 0; x < WIDTH; x++) {
            const p = idx(x, y) * 4;
            setPixel(p, cells[idx(x, y)] === 1 ? COLORS.empty : COLORS.soil);
          }
        }
      }

      function drawAnts() {
        for (const ant of ants) {
          const p = idx(ant.x, ant.y) * 4;
          setPixel(p, COLORS.ant);
        }
      }

      function buildSurfaceBand() {
        for (let x = 0; x < WIDTH; x++) {
          const roughness = Math.floor((Math.random() - 0.5) * 8);
          const depth = Math.max(14, Math.min(26, SURFACE_BAND + roughness));
          for (let y = 0; y < depth; y++) cells[idx(x, y)] = 1;
        }
      }

      function digOnePixel(x, y) {
        if (!isSoil(x, y)) return false;
        cells[idx(x, y)] = 1;
        return true;
      }

      function countEmptyNeighbors(x, y) {
        let n = 0;
        for (const [nx, ny] of neighbors4(x, y)) if (isEmpty(nx, ny)) n++;
        return n;
      }

      function generateOrganicRoomPixels(cx, cy, w, h) {
        const px = [];
        const rx = w / 2;
        const ry = h / 2;
        const left = Math.floor(cx - rx - 2);
        const right = Math.ceil(cx + rx + 2);
        const top = Math.floor(cy - ry - 2);
        const bottom = Math.ceil(cy + ry + 2);

        for (let y = top; y <= bottom; y++) {
          for (let x = left; x <= right; x++) {
            if (!inBounds(x, y) || y <= SURFACE_BAND + 3) continue;
            const nx = (x - cx) / rx;
            const ny = (y - cy) / ry;
            const dist = nx * nx + ny * ny;
            const jitter = (Math.random() - 0.5) * 0.34;
            if (dist <= 1 + jitter) px.push([x, y]);
          }
        }

        return new Set(px.map(([x, y]) => key(x, y)));
      }

      function getAllPlannedPixels() {
        const all = new Set();
        for (const plan of roomPlans) {
          for (const k of plan.pending) all.add(k);
        }
        return all;
      }

      function maybeAddRoomPlan(anchorX, anchorY) {
        if (anchorY < SURFACE_BAND + 14) return;
        if (Math.random() > 0.05) return;

        const roomW = 10 + Math.floor(Math.random() * 6); // 10..15
        const roomH = 5 + Math.floor(Math.random() * 6); // 5..10
        const cx = anchorX + Math.floor((Math.random() - 0.5) * 10);
        const cy = anchorY + 5 + Math.floor(Math.random() * 8);
        if (!inBounds(cx, cy)) return;

        let minDist = Infinity;
        for (const room of roomPlans) {
          minDist = Math.min(minDist, Math.hypot(cx - room.cx, cy - room.cy));
        }
        if (minDist < ROOM_SPACING_SOFT_MIN && Math.random() < 0.85) return;

        roomPlans.push({
          cx,
          cy,
          pending: generateOrganicRoomPixels(cx, cy, roomW, roomH),
        });
      }

      function roomFrontierDigCandidates(x, y) {
        const candidates = [];
        for (const [nx, ny] of neighbors4(x, y)) {
          if (!isSoil(nx, ny)) continue;
          const k = key(nx, ny);
          for (let i = 0; i < roomPlans.length; i++) {
            if (roomPlans[i].pending.has(k)) {
              candidates.push([nx, ny, i]);
              break;
            }
          }
        }
        return candidates;
      }

      function genericDigCandidates(x, y) {
        const candidates = [];
        for (const [nx, ny] of neighbors4(x, y)) {
          if (!isSoil(nx, ny)) continue;
          // Prefer continuing at existing tunnel fronts and digging downward.
          const support = countEmptyNeighbors(nx, ny);
          if (support < 1) continue;
          let score = support;
          if (ny > y) score += DOWNWARD_DIG_BONUS;
          if (ny <= y) score -= 0.8;
          candidates.push([nx, ny, score]);
        }
        return candidates;
      }

      function chooseMove(ant) {
        const moves = neighbors4(ant.x, ant.y).filter(([nx, ny]) => isEmpty(nx, ny));
        if (moves.length === 0) return null;

        // Prefer shared tunnels, active dig zones, and moving deeper underground.
        let best = moves[0];
        let bestScore = -Infinity;
        for (const [nx, ny] of moves) {
          let score = countEmptyNeighbors(nx, ny) * 2;
          if (ny > ant.y) score += DOWNWARD_MOVE_BONUS;
          if (ny < ant.y) score -= 1.2;
          if (ant.y < SURFACE_BAND + 50 && ny > ant.y) score += 2.2;
          if (Math.abs(nx - WIDTH / 2) < 18) score += 0.4;
          if (roomFrontierDigCandidates(nx, ny).length > 0) score += 3;
          score += Math.random() * 0.8;
          if (score > bestScore) {
            bestScore = score;
            best = [nx, ny];
          }
        }
        return best;
      }

      function pruneCompletedRooms() {
        for (let i = roomPlans.length - 1; i >= 0; i--) {
          if (roomPlans[i].pending.size === 0) roomPlans.splice(i, 1);
        }
      }

      function updateAnt(ant) {
        // Move exactly one pixel, only into adjacent empty pixels.
        const next = chooseMove(ant);
        if (next) {
          ant.x = next[0];
          ant.y = next[1];
        }

        // Dig exactly one adjacent soil pixel.
        const roomCandidates = roomFrontierDigCandidates(ant.x, ant.y);
        if (roomCandidates.length > 0) {
          const pick = roomCandidates[Math.floor(Math.random() * roomCandidates.length)];
          const [dx, dy, roomIndex] = pick;
          if (digOnePixel(dx, dy)) {
            roomPlans[roomIndex].pending.delete(key(dx, dy));
          }
          return;
        }

        const digCandidates = genericDigCandidates(ant.x, ant.y);
        if (digCandidates.length > 0) {
          digCandidates.sort((a, b) => b[2] - a[2]);
          const top = digCandidates.slice(0, Math.min(2, digCandidates.length));
          const [dx, dy] = top[Math.floor(Math.random() * top.length)];
          if (digOnePixel(dx, dy)) {
            maybeAddRoomPlan(dx, dy);
          }
        }
      }

      function addAnt() {
        const sx = Math.floor(WIDTH / 2) + Math.floor((Math.random() - 0.5) * 6);
        const sy = SURFACE_BAND + 2 + Math.floor(Math.random() * 3);
        ants.push({ x: sx, y: sy });
      }

      function removeAnt() {
        if (ants.length > 0) ants.pop();
      }

      addAntButton.addEventListener("click", addAnt);
      removeAntButton.addEventListener("click", removeAnt);

      let frame = 0;
      let lastDigTime = 0;
      function tick() {
        frame++;

        const now = performance.now();
        if (now - lastDigTime >= DIG_INTERVAL_MS) {
          lastDigTime = now;
          for (const ant of ants) updateAnt(ant);
          pruneCompletedRooms();
        }

        drawTerrain();
        drawAnts();
        ctx.putImageData(image, 0, 0);

        let empty = 0;
        for (let i = 0; i < cells.length; i++) if (cells[i] === 1) empty++;
        const plannedPixels = getAllPlannedPixels().size;
        meta.textContent = `frame=${frame} ants=${ants.length} roomPlans=${roomPlans.length} planned=${plannedPixels} empty=${empty} digMs=${DIG_INTERVAL_MS}`;

        requestAnimationFrame(tick);
      }

      buildSurfaceBand();
      for (let i = 0; i < INITIAL_ANT_COUNT; i++) addAnt();
      tick();
    </script>
  </body>
</html>
